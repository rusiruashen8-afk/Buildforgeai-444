<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BuildForge AI - Bolt Clone + Auth</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
body { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="text-white bg-[#0a0a0a] h-screen flex flex-col">

<!-- LOGIN MODAL - First eke pennana -->
<div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
  <div class="bg-[#111] border border-zinc-800 rounded-2xl w-full max-w-sm p-8 text-center">
    <h1 class="text-2xl font-bold mb-2">BuildForge AI</h1>
    <p class="text-zinc-400 text-sm mb-6">Login to start building machan!</p>
    
    <button id="googleBtn" class="w-full bg-white text-black py-3 rounded-lg font-semibold hover:bg-zinc-200 flex items-center justify-center gap-2">
      <i class="bi bi-google"></i> Continue with Google
    </button>
    
    <button id="githubBtn" class="w-full mt-3 bg-zinc-800 text-white py-3 rounded-lg font-semibold hover:bg-zinc-700 flex items-center justify-center gap-2">
      <i class="bi bi-github"></i> Continue with GitHub
    </button>
    
    <p id="loginError" class="text-red-400 text-xs mt-4 hidden"></p>
    <p class="text-[10px] text-zinc-600 mt-4">Secure login via Firebase</p>
  </div>
</div>

<!-- MAIN APP -->
<div class="flex flex-col h-screen">
  <header class="border-b border-zinc-800 p-4 flex justify-between items-center">
    <h1 class="font-bold text-lg">⚡ BuildForge AI</h1>
    <div class="flex items-center gap-3">
      <span id="userEmail" class="text-xs text-zinc-400 hidden"></span>
      <button id="logoutBtn" class="hidden text-xs bg-zinc-800 px-3 py-1 rounded hover:bg-red-600">Logout</button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Left Panel -->
    <div class="w-full md:w-[400px] border-r border-zinc-800 flex flex-col p-4 bg-[#0a0a0a]">
      <textarea id="promptInput" placeholder="Build a portfolio, SaaS landing, etc... machan" class="w-full h-32 bg-[#111] border border-zinc-800 rounded-xl p-3 text-sm outline-none focus:border-white resize-none"></textarea>
      <button id="generateBtn" class="mt-3 w-full bg-white text-black py-3 rounded-xl font-bold hover:bg-zinc-200">Generate Website ✨</button>
      
      <div id="thinkingSteps" class="mt-6 space-y-2 text-xs text-zinc-400 hidden"></div>
    </div>

    <!-- Right Preview -->
    <div class="flex-1 bg-[#111] relative">
      <div id="emptyState" class="absolute inset-0 flex items-center justify-center text-zinc-600 text-sm">Preview will appear here...</div>
      <iframe id="previewFrame" class="w-full h-full border-0 bg-white hidden"></iframe>
    </div>
  </div>
</div>

<script type="module">
import { auth, googleProvider, githubProvider } from './lib/firebase.js';
import { signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUser = null;

// Elements
const loginModal = document.getElementById('loginModal');
const googleBtn = document.getElementById('googleBtn');
const githubBtn = document.getElementById('githubBtn');
const logoutBtn = document.getElementById('logoutBtn');
const userEmail = document.getElementById('userEmail');
const loginError = document.getElementById('loginError');
const promptInput = document.getElementById('promptInput');
const generateBtn = document.getElementById('generateBtn');
const previewFrame = document.getElementById('previewFrame');
const emptyState = document.getElementById('emptyState');
const thinkingSteps = document.getElementById('thinkingSteps');

// Check login state
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    loginModal.classList.add('hidden');
    userEmail.textContent = user.email;
    userEmail.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    // Save user to DB for credits
    fetch('/api/save-user', { method: 'POST', body: JSON.stringify({ email: user.email, uid: user.uid }), headers: {'Content-Type':'application/json'} }).catch(()=>{});
  } else {
    currentUser = null;
    loginModal.classList.remove('hidden');
    userEmail.classList.add('hidden');
    logoutBtn.classList.add('hidden');
  }
});

// Google Login
googleBtn.onclick = async () => {
  loginError.classList.add('hidden');
  googleBtn.textContent = "Connecting...";
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (err) {
    console.error(err);
    loginError.textContent = err.message;
    loginError.classList.remove('hidden');
  }
  googleBtn.innerHTML = '<i class="bi bi-google"></i> Continue with Google';
};

// GitHub Login
githubBtn.onclick = async () => {
  try {
    await signInWithPopup(auth, githubProvider);
  } catch (err) {
    loginError.textContent = err.message;
    loginError.classList.remove('hidden');
  }
};

// Logout
logoutBtn.onclick = () => signOut(auth);

// Generate Website - C AS BEFORE
generateBtn.onclick = () => generateWebsite();

function generateWebsite(){
  if(!currentUser){ alert('Please login first machan!'); return; }
  const prompt = promptInput.value.trim(); 
  if(!prompt) return;

  thinkingSteps.classList.remove('hidden');
  thinkingSteps.innerHTML = "";
  const steps = ["Analyzing prompt...
